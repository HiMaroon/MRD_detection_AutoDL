# ROI + size branch
advanced:
  input_mode: roi_size
  bbox_csv: /root/autodl-tmp/projects/myq/SingleCellProject/yolo/bbox_from_yolo_preds.csv
  roi_expand_ratio: 0.25
  use_size_branch: true
  size_feature_dim: 5
  use_dual_scale: false
  center_weight_mode: gaussian
  center_weight_strength: 0.35
  use_stain_normalization: false
model:
  mixstyle_prob: 0.2
train:
  attention_regularization:
    use_border_attention_reg: true
    lambda_border: 0.03
    lambda_center: 0.02
