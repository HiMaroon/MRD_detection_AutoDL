# ROI + size branch
advanced:
  input_mode: roi_size
  bbox_csv: /path/to/yolo_bbox.csv
  roi_expand_ratio: 0.25
  use_size_branch: true
  size_feature_dim: 9
  use_dual_scale: false
  center_weight_mode: gaussian
  center_weight_strength: 0.35
  use_stain_normalization: true
model:
  mixstyle_prob: 0.2
train:
  attention_regularization:
    use_border_attention_reg: true
    lambda_border: 0.03
    lambda_center: 0.02
